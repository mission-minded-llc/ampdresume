name: "CD: Infrastructure"

# Applies Terraform changes once they are merged to main.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/actions/terraform-plan/**"
      - ".github/workflows/cd-infrastructure.yml"
  workflow_dispatch:

concurrency:
  # Terraform state does not tolerate concurrent applies.
  group: terraform-production
  cancel-in-progress: false

jobs:
  infra-deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/terraform-plan
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          neon_api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply Terraform
        working-directory: terraform
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: terraform apply -auto-approve -input=false
