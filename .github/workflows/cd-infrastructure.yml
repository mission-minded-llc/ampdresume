name: "CD: Infrastructure"

# Applies Terraform changes once they are merged to main.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/actions/terraform-plan/**"
      - ".github/workflows/cd-infrastructure.yml"
      - "scripts/gcp-fetch-secrets.sh"
  workflow_dispatch:

concurrency:
  # Terraform state does not tolerate concurrent applies.
  group: terraform-production
  cancel-in-progress: false

jobs:
  infra-deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_service_name: ${{ vars.CLOUD_RUN_SERVICE }}
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      TF_VAR_github_repository: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/terraform-plan
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service_name: ${{ vars.CLOUD_RUN_SERVICE }}
          neon_api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply Terraform
        working-directory: terraform
        env:
          NEON_API_KEY_FALLBACK: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            export NEON_API_KEY="$NEON_API_KEY_FALLBACK"
          fi
          terraform apply -auto-approve -input=false
