name: "CI: Infrastructure"

# Validates and plans Terraform changes on a pull request. Does not apply them.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/actions/terraform-plan/**"
      - ".github/workflows/ci-infrastructure.yml"
      - "scripts/gcp-fetch-secrets.sh"
  workflow_dispatch:

jobs:
  infra-test:
    name: Test Infrastructure
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_service_name: ${{ vars.CLOUD_RUN_SERVICE }}
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      TF_VAR_github_repository: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - uses: ./.github/actions/terraform-plan
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service_name: ${{ vars.CLOUD_RUN_SERVICE }}
          neon_api_key: ${{ secrets.NEON_API_KEY }}
