name: Integration Test

# Runs Cypress against a locally built app and a throwaway Postgres container.
# Specs are sharded across runners because account tests share one user/DB.
# Does not deploy anything.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/ampdresume?schema=ampdresume
  DATABASE_SSL: false
  # Used for sending emails for magic links.
  EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
  EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
  EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
  EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
  EMAIL_FROM: "Amp'd Resume <mail@ampdresume.com>"
  # Used for tracking, analytics, etc. The app only supports local and production.
  NEXT_PUBLIC_ENVIRONMENT_NAME: local
  NEXT_PUBLIC_GRAPHQL_ENDPOINT: http://localhost:3000/api/graphql
  NEXT_PUBLIC_BASE_URL: http://localhost:3000
  # Used by NextAuth.js for authentication.
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: this_is_obviously_not_a_secret
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  # Used by Sentry for error tracking.
  NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
  # Specific for the integration test.
  CYPRESS_TEST_EMAIL: test@ampdresume.com
  # For all AI integrations.
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  # Account specs share one Cypress user and mutate the same DB, so they cannot
  # run concurrently on one app/database. Each shard gets its own runner,
  # Postgres, and Next.js build.
  cypress:
    name: Cypress (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: navigation-theme
            spec: >-
              cypress/integration/navigation/**/*.cy.ts,cypress/integration/theme/**/*.cy.ts
          - name: account-featured-skills
            spec: cypress/integration/account/featuredProjectsSkills.cy.ts
          - name: account-core
            spec: >-
              cypress/integration/account/experience.cy.ts,cypress/integration/account/skills.cy.ts,cypress/integration/account/certifications.cy.ts,cypress/integration/account/featuredProjects.cy.ts,cypress/integration/account/import.cy.ts,cypress/integration/account/profile.cy.ts

    permissions:
      contents: read
      # Only needed to upload screenshots to Cloud Storage when a test fails.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-dependencies

      # Spin up a local Postgres instance.
      - name: Start Postgres
        run:
          docker run --name postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e
          POSTGRES_DB=ampdresume -p 5432:5432 -d postgres:16-alpine

      # Wait for Postgres to be ready
      - name: Wait for Postgres to be ready
        run: |
          echo "Waiting for Postgres to be ready..."
          timeout 30s bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
          echo "Postgres is ready!"

      - name: Seed data
        run: npm run prisma:migrate && npm run prisma:seed

      - name: Build Next.js app
        run: npm run build

      - name: Start Next.js app
        run: npm start &

      - name: Run Cypress tests
        run: npm run cypress:test -- --spec "${{ matrix.spec }}"

      - name: Authenticate to Google Cloud
        if: failure()
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Upload Cypress Screenshots
        if: failure()
        run: npm run cypress:upload:screenshots
        env:
          GCS_CI_ARTIFACTS_BUCKET: ${{ vars.GCS_CI_ARTIFACTS_BUCKET }}
          CYPRESS_SHARD: ${{ matrix.name }}

      - name: Stop and remove Postgres
        if: always()
        run: |
          docker stop postgres
          docker rm postgres

  # Keep a stable check name for branch protection. Matrix jobs report as
  # "Cypress (navigation-theme)", etc.
  integration-test:
    needs: cypress
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All Cypress shards passed
        run: |
          if [ "${{ needs.cypress.result }}" != "success" ]; then
            echo "Cypress shards: ${{ needs.cypress.result }}"
            exit 1
          fi
          echo "All Cypress shards passed."
