name: Integration Test

# Runs Cypress against a locally built app and a throwaway Postgres container.
# Specs are split round-robin across runners; each spec logs in as its own user.
# Does not deploy anything.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/ampdresume?schema=ampdresume
  DATABASE_SSL: false
  # Used for sending emails for magic links.
  EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
  EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
  EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
  EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
  EMAIL_FROM: "Amp'd Resume <mail@ampdresume.com>"
  # Used for tracking, analytics, etc. The app only supports local and production.
  NEXT_PUBLIC_ENVIRONMENT_NAME: local
  NEXT_PUBLIC_GRAPHQL_ENDPOINT: http://localhost:3000/api/graphql
  NEXT_PUBLIC_BASE_URL: http://localhost:3000
  # Used by NextAuth.js for authentication.
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: this_is_obviously_not_a_secret
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  # Used by Sentry for error tracking.
  NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
  # Specific for the integration test.
  CYPRESS_TEST_EMAIL: test@ampdresume.com
  # For all AI integrations.
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  # One production build for the whole workflow. Matrix shards copy this
  # artifact rather than compiling Next.js three times.
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    # No database during compile; same as the Cloud Run image build.
    env:
      DATABASE_URL: ""
      CYPRESS_INSTALL_BINARY: 0

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-dependencies

      - name: Build Next.js app
        run: npm run build

      - name: Upload Next.js build
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            .next
            !.next/cache
            !.next/cache/**
            !.next/standalone
            !.next/standalone/**

  # Each shard gets its own runner and Postgres, and reuses the shared Next.js
  # build. Spec files are assigned round-robin; account specs use per-file users.
  cypress:
    name: Cypress (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Values must be 1..N consecutive; length of this list is the shard count.
      matrix:
        shard: [1, 2, 3]

    permissions:
      contents: read
      # Only needed to upload screenshots to Cloud Storage when a test fails.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Start Postgres
        run:
          docker run --name postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e
          POSTGRES_DB=ampdresume -p 5432:5432 -d postgres:16-alpine

      - uses: ./.github/actions/setup-dependencies

      # Unpack off to the side. download-artifact will flatten a single top-level
      # `.next` folder onto the destination, which would overwrite package.json
      # with Next's generated `.next/package.json` (no scripts).
      - name: Download Next.js build
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: ${{ runner.temp }}/nextjs-build

      - name: Restore Next.js build
        run: |
          rm -rf .next
          download="${{ runner.temp }}/nextjs-build"
          if [ -f "$download/BUILD_ID" ]; then
            mv "$download" .next
          elif [ -f "$download/.next/BUILD_ID" ]; then
            mv "$download/.next" .next
          else
            echo "Next.js build artifact is missing BUILD_ID" >&2
            find "$download" -maxdepth 3 -print
            exit 1
          fi

      - name: Restore prebuild outputs
        run: npm run prebuild

      - name: Wait for Postgres to be ready
        run: |
          echo "Waiting for Postgres to be ready..."
          timeout 30s bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
          echo "Postgres is ready!"

      - name: Migrate and seed Cypress data
        run: npm run prisma:migrate && npm run prisma:seed:cypress

      - name: Start Next.js app
        run: npm start &

      - name: Wait for Next.js
        run:
          timeout 60s bash -c 'until curl -sf -o /dev/null http://localhost:3000; do sleep 1; done'

      - name: Run Cypress tests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          specs=$(npx tsx scripts/cypressSpecsForShard.ts)
          npm run cypress:test -- --spec "$specs"

      - name: Authenticate to Google Cloud
        if: failure()
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Upload Cypress Screenshots
        if: failure()
        run: npm run cypress:upload:screenshots
        env:
          GCS_CI_ARTIFACTS_BUCKET: ${{ vars.GCS_CI_ARTIFACTS_BUCKET }}
          CYPRESS_SHARD: ${{ matrix.shard }}

      - name: Stop and remove Postgres
        if: always()
        run: |
          docker stop postgres
          docker rm postgres

  # Keep a stable check name for branch protection. Matrix jobs report as
  # "Cypress (1)", "Cypress (2)", etc.
  integration-test:
    needs: [build, cypress]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All Cypress shards passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build: ${{ needs.build.result }}"
            exit 1
          fi
          if [ "${{ needs.cypress.result }}" != "success" ]; then
            echo "Cypress shards: ${{ needs.cypress.result }}"
            exit 1
          fi
          echo "All Cypress shards passed."
